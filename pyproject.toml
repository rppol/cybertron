[project]
name = "cybertron"
version = "0.1.0"
description = "CPU inference service for Hugging Face encoder models on OpenVINO"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.10",
    "uvicorn==0.34.0",
    "torch==2.8.0",
    "transformers==4.46.3",
    "openvino==2025.4.1",
    "nncf==3.1.0",
    "numpy>=1.23",
    "safetensors>=0.4",
    "pydantic>=2",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long memory test, run with -m slow"]
addopts = "-m 'not slow'"
